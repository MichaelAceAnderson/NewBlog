services:
  nb-mariadb-s:
    container_name: "nb-mariadb-c"
    build:
      context: ../
      dockerfile: ".docker/mariadb/Dockerfile.dev"
    env_file:
      - "mariadb/.env.dev"
    restart: on-failure
    volumes:
      - type: bind
        source: "mariadb/data/"
        target: "/var/lib/mysql/"
        # Only for MacOS
        consistency: consistent
      - type: bind
        source: "mariadb/logs/"
        target: "/var/log/mysql/"
        consistency: consistent
    networks:
      - nb-network
    ports:
      - 3306:3306

  nb-adminer-s:
    container_name: "nb-adminer-c"
    image: adminer
    env_file:
      - "adminer/.env.dev"
    restart: on-failure
    ports:
      - 8080:8080
    networks:
      - nb-network
    depends_on:
      - nb-mariadb-s

  nb-php-s:
    container_name: "nb-php-c"
    build:
      context: ../
      dockerfile: ".docker/php/Dockerfile.dev"
    env_file:
      - "mariadb/.env.dev"
      - "php/.env.dev"
    restart: on-failure
    volumes:
      - type: bind
        source: "../app/"
        target: "/var/www/html/"
        consistency: consistent
      - type: bind
        source: "php/logs/"
        target: "/var/log/php/"
        consistency: consistent
    ports:
      - "9000:9000"
    networks:
      - nb-network
    depends_on:
      - nb-mariadb-s

  nb-nginx-s:
    container_name: "nb-nginx-c"
    build:
      context: ../
      dockerfile: ".docker/nginx/Dockerfile.dev"
    env_file:
      - "nginx/.env.dev"
    restart: on-failure
    volumes:
      - type: bind
        source: "../app/"
        target: "/var/www/html/"
        consistency: consistent
      - type: bind
        source: "nginx/logs/"
        target: "/var/log/nginx/"
        consistency: consistent
    ports:
      - "80:80"
    networks:
      - nb-network
    depends_on:
      - nb-php-s

networks:
  nb-network:
    driver: bridge
